<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Inter, Arial, sans-serif" font-size="14">
  <rect x="10" y="10" width="780" height="400" rx="18" fill="#f8f9fa" stroke="#1a73e8" stroke-width="2.5"/>
  <text x="30" y="40" font-weight="800" fill="#174ea6" font-size="16">Cluster: gpu-share</text>

  <!-- control plane -->
  <rect x="30" y="60" width="190" height="320" rx="12" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="125" y="88" text-anchor="middle" font-weight="700" fill="#174ea6">Control plane</text>
  <text x="125" y="106" text-anchor="middle" fill="#5f6368" font-size="12">(run by Google on GKE)</text>
  <rect x="50" y="130" width="150" height="48" rx="8" fill="#fff" stroke="#4285f4"/>
  <text x="125" y="159" text-anchor="middle" fill="#202124">API server</text>
  <rect x="50" y="200" width="150" height="48" rx="8" fill="#fff" stroke="#4285f4"/>
  <text x="125" y="229" text-anchor="middle" fill="#202124">Scheduler</text>
  <rect x="50" y="270" width="150" height="48" rx="8" fill="#fff" stroke="#4285f4"/>
  <text x="125" y="299" text-anchor="middle" fill="#202124">Controllers</text>

  <!-- nodes -->
  <g>
    <rect x="250" y="60" width="160" height="320" rx="12" fill="#fff" stroke="#9aa0a6" stroke-width="2"/>
    <text x="330" y="88" text-anchor="middle" font-weight="700" fill="#202124">Node (CPU)</text>
    <rect x="270" y="120" width="120" height="42" rx="8" fill="#fef7e0" stroke="#fbbc04"/>
    <text x="330" y="146" text-anchor="middle" fill="#202124" font-size="12">pod: hello</text>
  </g>
  <g>
    <rect x="430" y="60" width="160" height="320" rx="12" fill="#fff" stroke="#34a853" stroke-width="2"/>
    <text x="510" y="88" text-anchor="middle" font-weight="700" fill="#202124">Node + 1 L4 GPU</text>
    <rect x="450" y="120" width="120" height="42" rx="8" fill="#e8f0fe" stroke="#4285f4"/>
    <text x="510" y="146" text-anchor="middle" fill="#202124" font-size="12">pod: t07-dosa</text>
    <rect x="450" y="172" width="120" height="42" rx="8" fill="#fce8e6" stroke="#ea4335"/>
    <text x="510" y="198" text-anchor="middle" fill="#202124" font-size="12">pod: t07-idli</text>
    <rect x="450" y="224" width="120" height="42" rx="8" fill="#fef7e0" stroke="#fbbc04"/>
    <text x="510" y="250" text-anchor="middle" fill="#202124" font-size="12">pod: t07-vada</text>
    <rect x="450" y="276" width="120" height="42" rx="8" fill="#e6f4ea" stroke="#34a853"/>
    <text x="510" y="302" text-anchor="middle" fill="#202124" font-size="12">pod: t07-chai</text>
    <rect x="450" y="330" width="120" height="34" rx="6" fill="#202124"/>
    <text x="510" y="352" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">GPU</text>
  </g>
  <g>
    <rect x="610" y="60" width="160" height="320" rx="12" fill="#fff" stroke="#34a853" stroke-width="2"/>
    <text x="690" y="88" text-anchor="middle" font-weight="700" fill="#202124">Node + 1 L4 GPU</text>
    <text x="690" y="200" text-anchor="middle" fill="#9aa0a6" font-size="12">(another table)</text>
    <rect x="630" y="330" width="120" height="34" rx="6" fill="#202124"/>
    <text x="690" y="352" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">GPU</text>
  </g>
</svg>
