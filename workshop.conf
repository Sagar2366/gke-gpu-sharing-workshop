# workshop.conf: one file that both the facilitator and attendees source.
# Facilitator: fill this in BEFORE the event and push it to the repo.
# Attendees: never edit this; `source scripts/attendee/setup.sh` reads it.

# ---- Which cluster are we on? ----------------------------------------------
# gke        = the shared GKE cluster (Plan A)
# jarvislabs = the k3s backup cluster on Jarvislabs GPU VMs (Plan B, see docs/planb)
export PLATFORM="jarvislabs"   # switch to "gke" if your GPU quota is approved

# ---- Where the shared cluster lives (organiser's project) -------------------
export WORKSHOP_PROJECT="your-organiser-project-id"
export CLUSTER="gpu-share"
export ZONE="us-central1-a"          # zonal cluster: all GPU pools in one zone
export REGION="${ZONE%-*}"

# ---- Images & model --------------------------------------------------------
# One image for every lab (it has PyTorch + vLLM), so nodes pull it only once.
# PIN THIS to the exact tag you rehearsed with. Check that the GKE "latest"
# driver supports the CUDA version the image was built with.
export BASE_IMAGE="vllm/vllm-openai:latest"
export IMAGE="$BASE_IMAGE"
export MODEL="google/gemma-3-1b-it"

# ---- Node pool names and sharing settings (keep in sync with 01-create-cluster.sh)
export TS_POOL="ts-l4"               # GPU time-sharing, 4 clients per L4
export MPS_POOL="mps-l4"             # NVIDIA MPS, 4 clients per L4
export MIG_POOL="mig-a100"           # MIG, A100 40GB sliced into 1g.5gb x7
export CLIENTS="4"
export MIG_PARTITION="1g.5gb"

# ---- Labels the labs use ----------------------------------------------------
export TABLE_LABEL="workshop.devfest/table"
export MODEL_CACHE_HOSTPATH="/var/lib/workshop/hf"

# ---- MIG slice used in Lab 5 (GKE: A100 40GB 1g.5gb) ------------------------
export MIG_MEMHOG_GIB="8"         # memhog target in Lab 5: bigger than one slice

# ---- Plan B (Jarvislabs) only ---------------------------------------------
if [[ "$PLATFORM" == "jarvislabs" ]]; then
  export IMAGE="workshop/lab-image:planb"          # built on each node by 02-gpu-nodes.sh
  export MIG_PARTITION="1g.18gb"                   # match MIG_PROFILE in jl.conf
  export MIG_MEMHOG_GIB="24"
  # Fill these in BEFORE the session: server public IP + KC_SECRET from scripts/jarvislabs/jl.conf
  export KUBECONFIG_BASE_URL="http://203.0.113.10:8088/change-me-16chars"
  export PROM_URL="http://203.0.113.10:30090"
  export GRAFANA_URL="http://203.0.113.10:30300"
fi
