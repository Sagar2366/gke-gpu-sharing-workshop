# codelabs.yml: the workshop codelab. Build with:  python3 tools/build_codelabs.py
defaults:
  author: DevFest Bengaluru
  updated: Nov 21, 2026

codelabs:
  - id: workshop
    title: "One GPU, Four Teams: hands-on GPU sharing on Kubernetes"
    category: Workshop
    lean: true
    duration: 90 min live + 15 min prep
    summary: Build a Kubernetes cluster from 3 Jarvislabs H200 VMs from your laptop, then time-slicing, NVIDIA MPS and MIG, a noisy neighbour, the gotchas, and Gemma on vLLM.
    steps:
      - {file: tools/build/labs/demo-workshop.md, vpath: codelabs/_.md, split: true, mins: [3, 15, 3, 3, 6, 6, 17, 8, 7, 12, 4, 3]}
